<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F3F3F0">
<title>Clínica L&amp;F Haddad · prévia reservada</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23F3F3F0' stroke='%239C7A45' stroke-width='2'/%3E%3Ctext x='32' y='40' font-family='Georgia' font-size='20' text-anchor='middle' fill='%231D2A3A'%3EL%26F%3C/text%3E%3C/svg%3E">
<style>
@font-face{font-family:"Cormorant";src:url(titulo.woff2) format("woff2");font-weight:300 700;font-display:swap}
:root{--fundo:#F3F3F0;--papel:#FBFBF9;--tinta:#1D2A3A;--tinta-2:#4E5A68;--linha:#DAD8D1;--latao:#9C7A45}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--fundo);color:var(--tinta);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.portao{min-height:100svh;display:grid;place-items:center;padding:32px 20px}
.cartao{width:min(400px,100%);text-align:center}
.mono{width:64px;height:64px;margin:0 auto 22px;border:1px solid var(--latao);border-radius:50%;display:grid;place-items:center;font:500 19px "Cormorant",Georgia,serif;color:var(--latao)}
h1{font:400 38px/1.05 "Cormorant",Georgia,serif;margin:0 0 10px;letter-spacing:-.005em}
.sub{color:var(--tinta-2);margin:0 0 30px;text-wrap:balance}
form{display:grid;gap:12px}
input[type=password]{width:100%;height:52px;border-radius:2px;border:1px solid var(--linha);background:var(--papel);color:var(--tinta);font-size:17px;padding:0 16px;text-align:center;letter-spacing:.04em}
input[type=password]:focus{outline:none;border-color:var(--latao)}
button{height:52px;border:0;border-radius:2px;background:var(--tinta);color:#F6F4EE;font-weight:500;font-size:16px;cursor:pointer;box-shadow:0 14px 30px -14px rgba(29,42,58,.6)}
button:disabled{opacity:.6;cursor:default}
.lembrar{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--tinta-2);font-size:14px}
.msg{min-height:22px;font-size:14px;color:var(--tinta-2);margin:0}
.msg.erro{color:#A33B3B}
.barra{height:2px;background:var(--linha);overflow:hidden;opacity:0;transition:opacity .3s}
.barra.ativa{opacity:1}
.barra i{display:block;height:100%;width:0;background:var(--latao);transition:width .2s}
.selo{margin-top:30px;font-size:12.5px;color:var(--tinta-2)}
</style>
</head>
<body>
<main class="portao">
  <div class="cartao">
    <div class="mono" aria-hidden="true">L&amp;F</div>
    <h1>Clínica L&amp;F Haddad</h1>
    <p class="sub">Prévia reservada do site.<br>Digite a senha que você recebeu.</p>
    <form id="f" autocomplete="off">
      <input id="senha" type="password" placeholder="Senha" aria-label="Senha" required>
      <button id="b" type="submit">Abrir a prévia</button>
      <label class="lembrar"><input id="lembrar" type="checkbox" checked> Lembrar neste aparelho</label>
      <div class="barra" aria-hidden="true"><i id="p"></i></div>
      <p class="msg" id="m" role="status"></p>
    </form>
    <p class="selo">Prévia reservada · ainda não é o site oficial</p>
  </div>
</main>
<script>
(function () {
  var VOLTAS = 310000, CHAVE = "lf-haddad-previa-senha";
  var f = document.getElementById("f"), campo = document.getElementById("senha"), botao = document.getElementById("b");
  var msg = document.getElementById("m"), barra = document.getElementById("p"), lembrar = document.getElementById("lembrar");
  var conteudo = null, chaveAtual = null;
  // celular (toque e lado menor até 600 px) recebe a página do celular; ?celular=0 ou =1 força
  var q = location.search, CEL = /celular=1/.test(q) || (!/celular=0/.test(q) && !!window.matchMedia &&
    matchMedia("(pointer: coarse)").matches && Math.min(screen.width, screen.height) <= 600);
  // baixa o pacote cifrado enquanto a pessoa digita a senha
  function baixar() {
    if (conteudo) { return conteudo; }
    barra.parentNode.classList.add("ativa");
    conteudo = fetch(CEL ? "pacote-celular.bin" : "pacote.bin").then(function (r) {
      if (!r.ok) { throw new Error("pacote " + r.status); }
      if (!r.body) { return r.arrayBuffer(); }
      var total = +r.headers.get("content-length") || 0, lido = 0, partes = [], leitor = r.body.getReader();
      function passo() {
        return leitor.read().then(function (x) {
          if (x.done) { return new Blob(partes).arrayBuffer(); }
          partes.push(x.value); lido += x.value.length;
          if (total) { barra.style.width = Math.min(100, lido / total * 100).toFixed(0) + "%"; }
          return passo();
        });
      }
      return passo();
    });
    conteudo.catch(function () { conteudo = null; });
    return conteudo;
  }
  // troca cada caminho citado (css/, js/, fontes/, img/, video/, com ou sem ../ na frente) pelo endereço blob: do arquivo
  var CITA = /(^|[^\w\/.-])(?:\.\.\/)?((?:css|js|fontes|img|video)\/[\w.\/-]+?\.(?:css|js|woff2|webp|png|jpg|mp4))/g;
  function trocar(texto, mapa) {
    return texto.replace(CITA, function (tudo, antes, caminho) { return mapa[caminho] ? antes + mapa[caminho] : tudo; });
  }
  function montar(claro) {
    var visao = new DataView(claro), tam = visao.getUint32(0), dec = new TextDecoder();
    var indice = JSON.parse(dec.decode(new Uint8Array(claro, 4, tam))), base = 4 + tam, mapa = {}, textos = [], pagina = "";
    indice.forEach(function (a) {
      if (a.x) { mapa[a.p] = "previa-video/" + a.x; return; }   // vídeo à parte: vem só quando a página pedir
      var bytes = new Uint8Array(claro, base + a.o, a.n);
      if (a.p === "pagina.html") { pagina = dec.decode(bytes); }
      else if (/\.(css|js)$/.test(a.p)) { textos.push([a, dec.decode(bytes)]); }
      else { mapa[a.p] = URL.createObjectURL(new Blob([bytes], { type: a.t })); }
    });
    // folhas de estilo e scripts depois das fotos, fontes e vídeos: eles citam esses arquivos
    textos.forEach(function (x) { mapa[x[0].p] = URL.createObjectURL(new Blob([trocar(x[1], mapa)], { type: x[0].t })); });
    return trocar(pagina, mapa);
  }
  // vídeo à parte (VIDEO_A_PARTE): a página troca a fonte do vídeo para "previa-video/v-….bin" e chama load(); o load() e o play() daqui
  // baixam esse arquivo, decifram com a mesma chave, põem o endereço blob: na fonte e só então seguem. A página abre sem esperar o vídeo.
  function armaVideo() {
    var guardados = {}, M = HTMLMediaElement.prototype, carregar = M.load, tocar = M.play;
    window.__previaVideo = function (nome) {
      if (!guardados[nome]) {
        guardados[nome] = fetch(nome).then(function (r) { if (!r.ok) { throw new Error("vídeo " + r.status); } return r.arrayBuffer(); })
          .then(function (buf) { var b = new Uint8Array(buf); return crypto.subtle.decrypt({ name: "AES-GCM", iv: b.slice(0, 12) }, chaveAtual, b.slice(12)); })
          .then(function (claro) { return URL.createObjectURL(new Blob([claro], { type: "video/mp4" })); });
        guardados[nome].catch(function () { delete guardados[nome]; });
      }
      return guardados[nome];
    };
    M.load = function () {
      var v = this, s = v.querySelector("source[src]"), u = s && s.getAttribute("src"), m = u && /^previa-video\/(v-[\w.-]+\.bin)$/.exec(u);
      if (!m) { return carregar.call(v); }
      var p = window.__previaVideo(m[1]).then(function (url) {
        if (s.getAttribute("src") === u) { s.setAttribute("src", url); }
        if (v.__previa === p) { v.__previa = null; }
        carregar.call(v);
      });
      v.__previa = p;
      p.catch(function () { if (v.__previa === p) { v.__previa = null; } });
    };
    M.play = function () {
      var v = this;
      if (v.__previa) { return v.__previa.then(function () { return tocar.call(v); }); }
      return tocar.call(v);
    };
  }
  function abrir(senha) {
    botao.disabled = true; msg.className = "msg"; msg.textContent = "Abrindo a prévia…";
    var baixado;
    return baixar().then(function (buf) {
      baixado = true;
      var b = new Uint8Array(buf), sal = b.slice(0, 16), iv = b.slice(16, 28), dados = b.slice(28);
      return crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]).then(function (k) {
        return crypto.subtle.deriveKey({ name: "PBKDF2", salt: sal, iterations: VOLTAS, hash: "SHA-256" }, k,
          { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      }).then(function (chave) { chaveAtual = chave; return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, chave, dados); });
    }).then(function (claro) {
      try { if (lembrar.checked) { localStorage.setItem(CHAVE, senha); } } catch (e) { /* navegador sem armazenamento */ }
      var html = montar(claro);
      armaVideo();
      document.open(); document.write(html); document.close();
    }).catch(function () {
      botao.disabled = false; msg.className = "msg erro";
      if (!baixado) { msg.textContent = "Não foi possível baixar a prévia. Confira a internet e tente de novo."; return; }
      try { localStorage.removeItem(CHAVE); } catch (e) { /* sem armazenamento */ }
      msg.textContent = "Senha não confere. Tente de novo.";
      campo.select();
    });
  }
  f.addEventListener("submit", function (e) { e.preventDefault(); if (campo.value) { abrir(campo.value.trim()); } });
  campo.addEventListener("input", baixar, { once: true });
  var guardada = null;
  try { guardada = localStorage.getItem(CHAVE); } catch (e) { /* sem armazenamento */ }
  if (guardada) { abrir(guardada); } else { campo.focus(); }
})();
</script>
</body>
</html>
